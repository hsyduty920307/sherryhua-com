{{- $pages := where site.RegularPages "Type" "in" site.Params.mainSections }}
{{- if and (gt (len $pages) 1) (in $pages . ) }}
<nav class="paginav" aria-label="Post navigation">
  {{- with $pages.Next . }}
  <a class="prev" href="{{ .Permalink }}">
    <span class="paginav-label">&larr; {{ i18n "prev_page" }}</span>
    <span class="paginav-title">{{- .Name -}}</span>
  </a>
  {{- end }}
  {{- with $pages.Prev . }}
  <a class="next" href="{{ .Permalink }}">
    <span class="paginav-label">{{ i18n "next_page" }} &rarr;</span>
    <span class="paginav-title">{{- .Name -}}</span>
  </a>
  {{- end }}
</nav>
{{- end }}
